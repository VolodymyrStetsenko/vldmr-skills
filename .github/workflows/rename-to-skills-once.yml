name: Rename repository branding to Skills

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-to-skills-once.yml

permissions:
  contents: write

concurrency:
  group: rename-repository-branding-to-skills
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy repository branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          workflow_path = Path('.github/workflows/rename-to-skills-once.yml')

          replacements = (
              ('VLDMR Security Skills', 'Skills'),
              ('VLDMR Skills', 'Skills'),
              ('vldmr-skill-security', 'skills-security'),
              ('vldmr-skills', 'skills'),
              ('vldmr_skills', 'skills'),
              ('VLDMR', 'Skills'),
              ('vldmr', 'skills'),
              ("Skills's", "Skills'"),
          )

          changed_files = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path == workflow_path:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed_files.append(path.as_posix())

          renamed_paths = []
          candidates = sorted(
              (
                  path for path in root.rglob('*')
                  if '.git' not in path.parts and path != workflow_path
                  and ('vldmr' in path.name.lower())
              ),
              key=lambda path: len(path.parts),
              reverse=True,
          )
          for path in candidates:
              new_name = path.name.replace('VLDMR', 'Skills').replace('vldmr', 'skills')
              destination = path.with_name(new_name)
              if destination != path:
                  path.rename(destination)
                  renamed_paths.append(f'{path.as_posix()} -> {destination.as_posix()}')

          print('Updated text files:')
          for item in changed_files:
              print(f'  {item}')
          print('Renamed paths:')
          for item in renamed_paths:
              print(f'  {item}')
          PY

      - name: Refresh package integrity manifests
        run: |
          python3 tools/validate_skill_security.py --refresh --apply
          python3 tools/validate_skill_security.py

      - name: Run repository validation
        run: |
          python3 tests/run_validation.py
          python3 tests/run_security_validation.py
          git diff --check

      - name: Verify legacy name is absent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/rename-to-skills-once.yml')
          matches = []
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts or path == workflow_path:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if 'vldmr' in text.lower() or 'vldmr' in path.as_posix().lower():
                  matches.append(path.as_posix())

          if matches:
              raise SystemExit('Legacy branding remains in: ' + ', '.join(matches))
          print('Legacy branding is absent from tracked text and paths.')
          PY

      - name: Publish rename and remove migration workflow
        shell: bash
        run: |
          rm .github/workflows/rename-to-skills-once.yml
          git add -A

          if git diff --cached --quiet; then
            echo 'No repository changes were required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: rename repository branding to Skills'
          git push origin HEAD:main
